  <rect width="600" height="600" rx="24" fill="url(#bg_phone)" />
  <!-- Smartphone Body -->
  <rect x="220" y="120" width="160" height="300" rx="28" fill="#1e293b" stroke="#334155" stroke-width="4" />
  <rect x="230" y="135" width="140" height="270" rx="20" fill="url(#screen_phone)" />
