<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" fill="none">
  <defs>
    <linearGradient id="bg_laptop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  <rect width="600" height="600" rx="24" fill="url(#bg_laptop)" />
  <circle cx="300" cy="270" r="160" fill="#6366f1" fill-opacity="0.12" filter="blur(30px)" />
  <!-- Screen Lid -->
  <rect x="160" y="150" width="280" height="180" rx="14" fill="#334155" stroke="#64748b" stroke-width="4" />
  <rect x="175" y="165" width="250" height="150" rx="8" fill="url(#screen)" />
  <!-- Screen Graphic -->
  <circle cx="300" cy="235" r="32" fill="#ffffff" fill-opacity="0.25" />
  <path d="M285 240l30-20v40z" fill="#ffffff" />
  <!-- Base -->
  <path d="M120 340h360l-25 35H145l-25-35z" fill="#1e293b" stroke="#475569" stroke-width="3" />
  <rect x="250" y="342" width="100" height="6" rx="3" fill="#64748b" />
  <!-- Tech label -->
  <text x="300" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#e2e8f0" text-anchor="middle" letter-spacing="1">Ultrabook Pro 14&quot;</text>
  <text x="300" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#94a3b8" text-anchor="middle">RENDIMIENTO &amp; PORTABILIDAD</text>
</svg>
